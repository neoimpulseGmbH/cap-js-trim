name: Release (cap-js-trim)

on:
    push:
        branches:
            - main
            - next

permissions:
    contents: write
    issues: write
    pull-requests: write

jobs:
    release:
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: "lts/*"
            - run: npm ci
            #- run: npm audit signature
            - name: Release
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
              run: |
                  set +e
                  npx semantic-release > /tmp/release.log 2>&1
                  status=$?
                  cat /tmp/release.log
                  sed -r 's/\x1b\[[0-9;]*m//g' /tmp/release.log | grep -aiE "npm error|401|403|EOTP|Failed step|An error occurred|semantic-release" | head -n 12 | python3 -c "
                  import sys
                  for line in sys.stdin:
                      print('::error title=diag::' + line.strip().replace('%','%25').replace('\r',''))
                  "
                  exit $status
